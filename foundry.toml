[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
ffi = false
offline=true
fs_permissions = [{ access = "read", path = "./"}]

remappings = [
    "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.6.1/",
    "@openzeppelin-v5.5.0/contracts/=dependencies/@openzeppelin-contracts-5.6.1/",
    "account-abstraction-0.9.0/=dependencies/account-abstraction-0.9.0/",
    "@account-abstraction/=dependencies/account-abstraction-0.9.0/",
    "@openzeppelin-contracts-5.6.1/=dependencies/@openzeppelin-contracts-5.6.1/",
    "openzeppelin-contracts/contracts/=dependencies/@openzeppelin-contracts-5.6.1/",
    "forge-std/=dependencies/forge-std-1.15.0/src/",
    "forge-std-1.15.0/=dependencies/forge-std-1.15.0/"
]

[soldeer]
remappings_generate = true
remappings_regenerate = true

[dependencies]
"@openzeppelin-contracts" = "5.6.1"
"account-abstraction" = { version = "0.9.0", url = "https://github.com/eth-infinitism/account-abstraction/archive/refs/tags/v0.9.0.zip" }
forge-std = "latest"

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
localhost = "http://127.0.0.1:8545"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
